<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>

     <a-assets>
        <img id="texture1" src="assets/image/foret sombre.avif">
            <img id="texture2" src="assets/image/bois sombre.jpg">
                <img id="texture3" src="assets/image/vieux papier paint.jpg">
                   <img id="texture4" src="assets/image/moquette.jpg">
     </a-assets>




    <a-scene>
      <a-plane position="-1 -0.850 -0.010" rotation="-90 0 0" height="4"; width= "4" src= "#texture4"></a-plane>
      <a-sky color="skyblue" src="#texture1" ></a-sky>
      

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1.76"
         material="src: #texture2; shader: standard"
          position="-2.2 1.2 -2" ></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1.6"
         material="src: #texture2; shader: standard"
          position="0.30 1.2 -2" ></a-entity>

          <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1.34"
          material="src: #texture3; shader: standard"
          position="-0.7 1.2 -1"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 3.2"
          material="src: #texture2; shader: standard"
          position="-3 1.2 -0.5"
          rotation="0 90 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 4"
           material="src: #texture2; shader: standard"
          position="-1 1.2 2"
          rotation="0 0 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1.8"
          material="src: #texture3; shader: standard"
          position="-1.2 1.2 1"
          rotation="0 0 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1"
        material="src: #texture3; shader: standard"
          position="-2 1.2 1.4"
          rotation="0 90 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 4"
           material="src: #texture2; shader: standard"
          position="1 1.2 0.1"
          rotation="0 90 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1"
          material="src: #texture3; shader: standard"
          position="-1.41 1.2 -1.4"
          rotation="0 90 0"></a-entity>
          
      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1"
          material="src: #texture3; shader: standard"
          position="-1.4 1.2 0.5"
          rotation="0 90 0"></a-entity>

      <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 1.1"
          material="src: #texture3; shader: standard"
          position="-0.13 1.2 -0.4"
          rotation="0 90 0"></a-entity>

            <a-entity geometry="primitive: box; depth: 0.18; height: 4 ; width: 0.8"
          material="src: #texture3; shader: standard"
          position="-1.7 1.2 -0.05"
          rotation="0 155 0"></a-entity>

<!-- Default lighting injected by A-Frame. -->
<a-entity light="type: ambient; color: #BBB"></a-entity>
<a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>

<a-entity camera="active: true" look-controls wasd-controls position="0 1.6 0" wasd-controls></a-entity>

    </a-scene>

  </body>

</html>
